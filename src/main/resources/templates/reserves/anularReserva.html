<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anul·lar reserva - NOTHINGAN PRI S.A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/agents.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark m-0">Anul·lar reserva</h2>
                <p class="text-muted small mb-0 mt-1">Indica el motiu perquè quedi registrat a la reserva.</p>
            </div>
            <a th:href="@{/dashboard/reserves/{codi}(codi=${reserva.codiReserva})}"
               class="btn btn-secondary fw-semibold px-3 py-2" style="border-radius: 8px;">
                <i class="fa-solid fa-arrow-left me-1"></i> Tornar al detall
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <div class="form-card shadow-sm">
            <div class="mb-4">
                <h5 class="fw-bold text-dark" th:text="'Reserva #' + ${reserva.codiReserva}">Reserva</h5>
                <p class="text-muted mb-0"
                   th:text="${(reserva.client != null ? reserva.client.nom : 'Client') + ' · ' + (reserva.vehicle != null ? (reserva.vehicle.marca + ' ' + reserva.vehicle.model) : 'Vehicle')}">
                    Client · Vehicle
                </p>
            </div>

            <form th:action="@{/dashboard/reserves/{codi}/anular(codi=${reserva.codiReserva})}" method="post">
                <div class="mb-4">
                    <label for="anulacio_motiu" class="form-label fw-semibold">Motiu de l'anul·lació</label>
                    <textarea id="anulacio_motiu" name="anulacio_motiu" class="form-control" rows="4"
                              placeholder="Explica per què s'anul·la aquesta reserva..."
                              th:text="${anulacioMotiu}" required></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/dashboard/reserves/{codi}(codi=${reserva.codiReserva})}"
                       class="btn btn-light border px-4 fw-semibold">Cancel·lar</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                        <i class="fa-solid fa-ban me-1"></i> Confirmar anul·lació
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
