<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre de Client - NOTHINGAN PRI S.A.</title>
    <!-- FontAwesome per les icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/cataleg.css}">
    <link rel="stylesheet" th:href="@{/registre.css}">
</head>
<body>

    <!-- Header corporatiu -->
    <header>
        <div class="marca">
            <div class="logo">NP</div>
            <div>
                <strong>NOTHINGAN PRI S.A.</strong>
                <small>PORTAL CLIENT</small>
            </div>
        </div>

        <div class="nav-header">
            <a th:href="@{/cataleg}">Catàleg</a>
            <div style="display: flex; gap: 10px; align-items: center; margin-left: 12px;">
                <a th:href="@{/login}" class="btn" style="background: transparent; color: #fff; border: 1px solid #334155; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 12px;">
                    Iniciar sessió
                </a>
            </div>
        </div>
    </header>

    <!-- Formulari de Registre -->
    <div class="registre-container">
        <h2>Sol·licitud de Registre de Client</h2>
        <p class="registre-subtitol">Completeu les vostres dades personals i documentació per activar el compte de client.</p>

        <!-- Avisos d'error -->
        <div th:if="${error}" class="alert-error">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/registre}" th:object="${client}" method="post" enctype="multipart/form-data" class="form-grid">

            <div class="seccio-títol">1. Dades personals i d'accés</div>

            <div class="form-grup full-width">
                <label>Nom complet (com figura al DNI) *</label>
                <input type="text" th:field="*{nom}" required placeholder="Ex: Joan Garcia i Soler">
            </div>

            <div class="form-grup">
                <label>DNI / NIE / Passaport *</label>
                <input type="text" th:field="*{dni}" required placeholder="Ex: 12345678Z">
            </div>

            <div class="form-grup">
                <label>Data de caducitat del DNI *</label>
                <input type="date" th:field="*{dataCaducitatDNI}" required>
            </div>

            <div class="form-grup">
                <label>Adreça electrònica *</label>
                <input type="email" th:field="*{email}" required placeholder="Ex: joan@gmail.com">
            </div>

            <div class="form-grup">
                <label>Contrasenya per al portal *</label>
                <input type="password" th:field="*{password}" minlength="8" placeholder="Mínim 8 caràcters" required>
            </div>

            <div class="form-grup">
                <label>Telèfon de contacte *</label>
                <input type="tel" th:field="*{telefon}" required placeholder="Ex: 612 345 678">
            </div>

            <div class="form-grup">
                <label>Data de naixement *</label>
                <input type="date" th:field="*{dataNaixement}" required>
            </div>

            <div class="form-grup">
                <label>Nacionalitat *</label>
                <input type="text" th:field="*{nacionalitat}" required placeholder="Ex: Espanyola">
            </div>

            <div class="form-grup">
                <label>Adreça completa *</label>
                <input type="text" th:field="*{adreca}" required placeholder="Ex: Carrer Major 12, Terrassa">
            </div>

            <div class="seccio-títol">2. Permís de conduir</div>

            <div class="form-grup">
                <label>Tipus de llicència *</label>
                <select th:field="*{tipusLlicencia}" required>
                    <option value="B">B (Automòbils)</option>
                    <option value="A">A (Motocicletes)</option>
                    <option value="C">C (Camions)</option>
                </select>
            </div>

            <div class="form-grup">
                <label>Data de caducitat del carnet de conduir *</label>
                <input type="date" th:field="*{dataCaducitatCarnet}" required>
            </div>

            <div class="seccio-títol">3. Verificació d'identitat (Imatges max 5MB)</div>

            <div class="form-grup">
                <label>Foto DNI Frontal *</label>
                <input type="file" name="fotoDniFrontal" accept="image/png, image/jpeg" required>
            </div>

            <div class="form-grup">
                <label>Foto DNI Posterior *</label>
                <input type="file" name="fotoDniPosterior" accept="image/png, image/jpeg" required>
            </div>

            <div class="form-grup full-width">
                <label>Foto Carnet de Conduir *</label>
                <input type="file" name="fotoCarnet" accept="image/png, image/jpeg" required>
            </div>

            <div class="form-grup full-width" style="margin-top: 16px;">
                <button type="submit" class="btn-enviar-registre">
                    Enviar sol·licitud de registre
                </button>
            </div>
        </form>
    </div>

</body>
</html>
