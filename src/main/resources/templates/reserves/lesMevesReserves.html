<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les meves reserves - NOTHINGAN PRI S.A.</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/cataleg.css}">
    <link rel="stylesheet" th:href="@{/reservesClient.css}">
</head>
<body>

    <!-- Header corporatiu (Enllaç del logo apunta a Home) -->
    <header>
        <a th:href="@{/}" class="marca">
            <div class="logo">NP</div>
            <div>
                <strong>NOTHINGAN PRI S.A.</strong>
                <small>PORTAL CLIENT</small>
            </div>
        </a>

        <div class="nav-header">
            <a th:href="@{/cataleg}">Catàleg</a>
            <a th:href="@{/reserves-client}" class="active">Les meves reserves</a>
            
            <div class="accés-usuaris">
                <!-- Botó de Tancar Sessió (Formulari POST compatible amb Spring Security) -->
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-login" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        <i class="fa-solid fa-right-from-bracket"></i> Tancar sessió
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- Contingut Principal -->
    <main class="reserves-container">
        
        <div class="reserves-cap">
            <h2>Les meves reserves</h2>
            <p>Consulta l'històric i l'estat de les teves sol·licituds de lloguer de vehicles.</p>
        </div>

        <!-- Missatges de Feedback -->
        <div th:if="${missatge}" class="alert-success">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${missatge}"></span>
        </div>
        <div th:if="${error}" class="alert-error">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <!-- Taula de Reserves -->
        <div class="card-taula">
            <table class="taula-reserves">
                <thead>
                    <tr>
                        <th>Codi</th>
                        <th>Vehicle</th>
                        <th>Període de Lloguer</th>
                        <th>Cost Total</th>
                        <th>Fiança</th>
                        <th>Estat</th>
                        <th>Accions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reserves == null or #lists.isEmpty(reserves)}">
                        <td colspan="7" class="text-center py-4">
                            No tens cap reserva realitzada actualment. <a th:href="@{/cataleg}" class="fw-bold">Explorar el catàleg</a>
                        </td>
                    </tr>

                    <tr th:each="r : ${reserves}">
                        <td class="codi-reserva fw-bold" th:text="${'#' + r.codiReserva}"></td>
                        <td>
                            <div class="vehicle-info">
                                <strong th:text="${r.vehicle != null ? (r.vehicle.marca + ' ' + r.vehicle.model) : '-'}"></strong>
                                <small th:text="${r.vehicle != null ? r.vehicle.matricula : '-'}"></small>
                            </div>
                        </td>
                        <td>
                            <div class="dates-info">
                                <span th:text="${#temporals.format(r.dataInici, 'dd/MM/yyyy')} + ' (' + ${r.horaInici} + ')'"></span>
                                <i class="fa-solid fa-arrow-right icona-flecha"></i>
                                <span th:text="${#temporals.format(r.dataFi, 'dd/MM/yyyy')} + ' (' + ${r.horaFi} + ')'"></span>
                            </div>
                        </td>
                        <td class="preu-total fw-bold" th:text="${#numbers.formatDecimal(r.costTotal, 1, 2) + ' €'}"></td>
                        <td th:text="${#numbers.formatDecimal(r.fianca, 1, 2) + ' €'}"></td>
                        <td>
                            <span class="badge-estat" 
                                  th:classappend="${r.estat == 'CONFIRMADA' ? 'badge-actiu' : (r.estat == 'ANULLADA' ? 'badge-inactiu' : 'badge-pendent')}"
                                  th:text="${r.estat}"></span>
                        </td>
                        <td>
                            <form th:if="${r.estat != 'ANULLADA' and r.estat != 'FINALITZADA'}" 
                                  th:action="@{'/reserves-client/anular/' + ${r.codiReserva}}" 
                                  method="post" 
                                  onsubmit="return confirm('Estàs segur que vols anul·lar aquesta reserva?');">
                                <button type="submit" class="btn-anular">
                                    <i class="fa-solid fa-xmark"></i> Anul·lar
                                </button>
                            </form>
                            <span th:unless="${r.estat != 'ANULLADA' and r.estat != 'FINALITZADA'}" class="text-muted">-</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
