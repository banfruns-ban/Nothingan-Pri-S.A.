<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Vehicle - NOTHINGAN PRI S.A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sidebar-bg: #111827; --sidebar-active: #1d4ed8; --main-bg: #f9fafb; --card-border: #e5e7eb; }
        body { background-color: var(--main-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #9ca3af; min-height: 100vh; position: fixed; top: 0; left: 0; z-index: 100; }
        .sidebar .brand { padding: 24px 20px; color: #ffffff; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid #1f2937; }
        .sidebar .brand span { display: block; font-size: 0.75rem; color: #6b7280; font-weight: 400; margin-top: 2px; }
        .sidebar .nav-link { color: #9ca3af; padding: 12px 20px; font-size: 0.95rem; display: flex; align-items: center; gap: 12px; border-radius: 8px; margin: 4px 12px; }
        .sidebar .nav-link.active { background-color: var(--sidebar-active); color: #ffffff; font-weight: 500; }
        .main-content { margin-left: 260px; padding: 40px; }
        .form-card { background: #ffffff; border: 1px solid var(--card-border); border-radius: 12px; padding: 28px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">NOTHINGAN PRI S.A<span>PANEL DE CONTROL AGENT</span></div>
        <nav class="mt-3">
            <a href="#" class="nav-link"><i class="fa-solid fa-border-all"></i> Dashboard</a>
            <a th:href="@{/vehicles}" class="nav-link active"><i class="fa-solid fa-car"></i> Flota de Vehicles</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-users"></i> Gestió de Clients</a>
            <a href="#" class="nav-link"><i class="fa-regular fa-calendar-check"></i> Reserves Actives</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="mb-4">
            <h2 class="fw-bold text-dark m-0">Alta de Nou Vehicle</h2>
            <p class="text-muted small mb-0 mt-1">Registra un nou vehicle a la flota de l'empresa.</p>
        </div>

        <div class="form-card shadow-sm">
            <form th:action="@{/vehicles/guardar}" th:object="${vehicle}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Matrícula</label>
                        <input type="text" th:field="*{matricula}" class="form-control" th:errorclass="'is-invalid'" placeholder="Ex: 4823LKF" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Marca</label>
                        <input type="text" th:field="*{marca}" class="form-control" th:errorclass="'is-invalid'" placeholder="Ex: Toyota" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Model</label>
                        <input type="text" th:field="*{model}" class="form-control" th:errorclass="'is-invalid'" placeholder="Ex: Yaris Hybrid" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Any Matriculació</label>
                        <input type="number" th:field="*{anyMatriculacio}" class="form-control" th:errorclass="'is-invalid'" placeholder="2024" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('anyMatriculacio')}" th:errors="*{anyMatriculacio}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Categoria / Tipus</label>
                        <select th:field="*{tipusVehicle}" class="form-select" th:errorclass="'is-invalid'">
                            <option value="">-- Selecciona --</option>
                            <option value="Econòmic">Econòmic</option>
                            <option value="SUV">SUV</option>
                            <option value="Furgoneta">Furgoneta</option>
                            <option value="Urbà">Urbà</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tipusVehicle')}" th:errors="*{tipusVehicle}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Preu / Dia (€)</label>
                        <input type="number" step="0.01" th:field="*{preuHora}" class="form-control" th:errorclass="'is-invalid'" placeholder="45.00" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('preuHora')}" th:errors="*{preuHora}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Fiança (€)</label>
                        <input type="number" step="0.01" th:field="*{fianca}" class="form-control" th:errorclass="'is-invalid'" placeholder="300.00" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fianca')}" th:errors="*{fianca}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Límit Quilometratge</label>
                        <input type="number" th:field="*{limitQuilometratge}" class="form-control" th:errorclass="'is-invalid'" placeholder="200" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('limitQuilometratge')}" th:errors="*{limitQuilometratge}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Mín. Dies Lloguer</label>
                        <input type="number" th:field="*{minDiesLloguer}" class="form-control" th:errorclass="'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('minDiesLloguer')}" th:errors="*{minDiesLloguer}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Màx. Dies Lloguer</label>
                        <input type="number" th:field="*{maxDiesLloguer}" class="form-control" th:errorclass="'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('maxDiesLloguer')}" th:errors="*{maxDiesLloguer}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Estat Operatiu</label>
                        <input type="text" th:field="*{estat}" class="form-control" th:errorclass="'is-invalid'" placeholder="Disponible" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('estat')}" th:errors="*{estat}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Descripció Pública</label>
                        <textarea th:field="*{descripcio}" class="form-control" rows="2" th:errorclass="'is-invalid'" placeholder="Detalls públics visibles per als clients..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcio')}" th:errors="*{descripcio}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold text-danger">Comentaris Privats (Només Agent / Admin)</label>
                        <textarea th:field="*{comentarisPrivats}" class="form-control" rows="2" placeholder="Anotacions internes..."></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">Crear Vehicle</button>
                    <a th:href="@{/vehicles}" class="btn btn-outline-secondary px-4">Cancel·lar</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
