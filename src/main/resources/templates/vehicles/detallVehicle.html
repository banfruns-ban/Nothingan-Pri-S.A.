¡<!-- Dates d'activació / desactivació si n'hi ha -->
                <div class="row g-4 border-bottom pb-4 mb-4" 
                     th:if="${vehicle.dataDesactivacio != null or vehicle.dataActivacio != null}">
                    <div class="col-md-4" th:if="${vehicle.dataDesactivacio != null}">
                        <div class="label-title">Última data de desactivació</div>
                        <div class="value-text" th:text="${#temporals.format(vehicle.dataDesactivacio, 'dd/MM/yyyy')}">01/01/2026</div>
                    </div>

                    <div class="col-md-4" th:if="${vehicle.dataFiDesactivacio != null}">
                        <div class="label-title">Data prevista fi desactivació</div>
                        <div class="value-text" th:text="${#temporals.format(vehicle.dataFiDesactivacio, 'dd/MM/yyyy')}">10/01/2026</div>
                    </div>

                    <div class="col-md-4" th:if="${vehicle.dataActivacio != null}">
                        <div class="label-title">Última data d'activació</div>
                        <div class="value-text" th:text="${#temporals.format(vehicle.dataActivacio, 'dd/MM/yyyy')}">10/01/2026</div>
                    </div>

                    <div class="col-md-4" th:if="${vehicle.motiuActivacio != null and !vehicle.motiuActivacio.isBlank()}">
                        <div class="label-title">Últim motiu d'activació</div>
                        <div class="value-text" th:text="${vehicle.motiuActivacio}">Manteniment</div>
                    </div>

                    <div class="col-md-4" th:if="${vehicle.importActivacio != null}">
                        <div class="label-title">Import última intervenció</div>
                        <div class="value-text" th:text="${#numbers.formatDecimal(vehicle.importActivacio, 1, 2) + ' €'}">50.00 €</div>
                    </div>
                </div>
